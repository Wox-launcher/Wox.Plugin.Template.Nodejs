name: Sync Skills from Wox

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout Wox repo
        uses: actions/checkout@v4
        with:
          repository: Wox-launcher/Wox
          path: _wox_upstream
          sparse-checkout: |
            .agents/skills/wox-plugin-creator
          sparse-checkout-cone-mode: false

      - name: Sync skill files
        run: |
          SOURCE="_wox_upstream/.agents/skills/wox-plugin-creator"
          TARGET=".agents/skills/wox-plugin-creator"

          if [ ! -d "$SOURCE" ]; then
            echo "Source directory not found"
            exit 1
          fi

          # Remove old files and copy new ones
          rm -rf "$TARGET"
          cp -r "$SOURCE" "$TARGET"
          python3 scripts/adapt-synced-skill.py
          python3 scripts/test-scaffold.py

          # Clean up
          rm -rf _wox_upstream

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- .agents/skills/wox-plugin-creator/)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync wox-plugin-creator skill from upstream"
          title: "chore: sync wox-plugin-creator skill from Wox upstream"
          body: |
            Auto-sync `wox-plugin-creator` skill from [Wox-launcher/Wox](https://github.com/Wox-launcher/Wox/tree/master/.agents/skills/wox-plugin-creator). Preserve the Node.js template initialization integration when reconciling changes.

            This PR is automatically created by GitHub Action.
          branch: auto/sync-wox-plugin-creator-skill
          delete-branch: true
          labels: automated
